name: Build APK and Publish Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.1-ui-fix-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Smart PDF Price Finder AI $TAG" \
            --notes "APK build with fixed responsive button sizing and phone UI layout."
